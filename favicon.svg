  <!-- Left handle -->
  <path d="M 25 30 Q 15 30 15 40 Q 15 45 20 45 L 25 45" 
        fill="none" 
        stroke="url(#trophy-gradient)" 
        stroke-width="3"/>
  
  <!-- Right handle -->
  <path d="M 75 30 Q 85 30 85 40 Q 85 45 80 45 L 75 45" 
        fill="none" 
        stroke="url(#trophy-gradient)" 
        stroke-width="3"/>
  
  <!-- Trophy base -->
  <rect x="35" y="75" width="30" height="10" fill="url(#trophy-gradient)" stroke="#B8860B" stroke-width="1.5"/>
  
  <!-- Shine effect -->
  <ellipse cx="42" cy="38" rx="8" ry="12" fill="rgba(255,255,255,0.3)"/>
