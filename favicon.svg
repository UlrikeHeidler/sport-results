      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Trophy cup -->
  <path d="M 30 25 L 25 35 Q 25 45 30 45 L 30 55 Q 30 65 40 65 L 40 75 L 35 75 L 35 85 L 65 85 L 65 75 L 60 75 L 60 65 Q 70 65 70 55 L 70 45 Q 75 45 75 35 L 70 25 Z" 
        fill="url(#trophy-gradient)" 
